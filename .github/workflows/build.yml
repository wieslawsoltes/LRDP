name: Build and test
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev libx11-dev libxtst-dev libxfixes-dev libxrandr-dev libglib2.0-dev libpipewire-0.3-dev libavcodec-dev libavutil-dev libswscale-dev xvfb ffmpeg python3 freerdp2-x11
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLRDP_SANITIZE=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Configure optimized build
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build optimized executable
        run: cmake --build build-release --parallel 2
