name: Build and test
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Package exact source revision
        run: |
          mkdir -p artifacts
          git archive --format=tar.gz --prefix=LRDP/ HEAD > artifacts/lrdp-source.tar.gz
          git rev-parse HEAD > artifacts/revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lrdp-source
          path: artifacts/
          retention-days: 7
      - name: Install native development dependencies
        run: |
          sudo apt-get update > /tmp/lrdp-apt.log 2>&1 || { tail -100 /tmp/lrdp-apt.log; exit 1; }
          sudo apt-get install -y cmake ninja-build g++ pkg-config libssl-dev libfuse3-dev fuse3 libpng-dev libkrb5-dev gss-ntlmssp libx11-dev libxtst-dev libxfixes-dev libxrandr-dev libxau-dev libglib2.0-dev libpipewire-0.3-dev libavcodec-dev libavutil-dev libswscale-dev xvfb ffmpeg python3 freerdp2-x11 dbus-daemon pipewire-bin xserver-xorg-core xserver-xorg-video-dummy xauth x11-xserver-utils xterm >> /tmp/lrdp-apt.log 2>&1 || { tail -100 /tmp/lrdp-apt.log; exit 1; }
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLRDP_SANITIZE=ON -DLRDP_TEST_NTLM=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml
      - name: Configure optimized build
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build optimized executable
        run: cmake --build build-release --parallel 2
      - name: Verify protocol-only configuration
        run: |
          cmake -S . -B build-core -G Ninja -DLRDP_BUILD_SERVER=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core --parallel 2
          ctest --test-dir build-core --output-on-failure
      - name: Verify dependency-minimal preflight
        run: |
          cmake -S . -B build-minimal -G Ninja -DCMAKE_BUILD_TYPE=Release -DLRDP_X11=OFF -DLRDP_FFMPEG=OFF -DLRDP_GSSAPI=OFF -DLRDP_AUDIO=OFF -DLRDP_PORTAL=OFF -DLRDP_FUSE=OFF -DLRDP_PRINTING=OFF
          cmake --build build-minimal --target lrdpd --parallel 2
          ctest --test-dir build-minimal -R '^deployment_preflight$' --output-on-failure --output-junit minimal-preflight.xml
      - name: Collect build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrdp-linux-evidence
          retention-days: 7
          path: |
            artifacts/revision.txt
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
            build-release/lrdpd
            build-minimal/minimal-preflight.xml
